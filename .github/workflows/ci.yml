name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: github_repo

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Dead-code / undefined names (pyflakes)
        run: python -m pyflakes netwarrior.py
      - name: Compile
        run: python -m compileall -q netwarrior.py
      - name: Tests
        run: pytest -q
