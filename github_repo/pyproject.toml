[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netwarrior"
version = "0.3.0"
description = "Async network security testing suite (authorized use only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["security", "pentest", "network", "stress-testing", "red-team"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0.0",
    "scapy>=2.5.0",
    "psutil>=5.9.0",
    "paramiko>=3.0.0",
    "dnspython>=2.2.0",
    "aiohttp>=3.9.0",
    "tomli>=2.0.0 ; python_version < '3.11'",
    "tomli_w>=1.0.0",
    "uvloop>=0.19.0 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pyflakes>=3.0", "ruff>=0.4"]

[project.scripts]
netwarrior = "netwarrior:_run"

[project.gui-scripts]
netwarrior-gui = "netwarrior_gui:main"

[project.urls]
Repository = "https://github.com/dev-joshua-py/NetWARRIOR"

[tool.setuptools]
py-modules = ["netwarrior", "netwarrior_gui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E741", "B008"]

[tool.ruff.lint.per-file-ignores]
# the dependency check must run before third-party imports
"netwarrior.py" = ["E402"]
"tests/conftest.py" = ["E402"]
